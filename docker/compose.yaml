name: antinat

services:
  controller:
    image: ghcr.io/gxbrave/antinat-controller:v1.0.0-beta.2
    network_mode: host
    user: "65532:65532"
    restart: unless-stopped
    volumes:
      - controller-data:/var/lib/antinat
      - controller-log:/var/log/antinat
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3111/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  controller-data:
  controller-log:
