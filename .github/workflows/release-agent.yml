name: Publish AntiNAT Agent release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable beta version, for example v1.0.0-beta.3
        required: true
        default: v1.0.0-beta.3
        type: string
      agent_ref:
        description: Agent commit or branch to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: antinat-release
    timeout-minutes: 30
    env:
      GO_VERSION: '1.26.6'
      VERSION: ${{ inputs.version }}
      AGENT_REF: ${{ inputs.agent_ref }}
    steps:
      - name: Checkout Agent source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gxbrave/AntiNAT-Agent
          ref: ${{ inputs.agent_ref }}
          path: agent
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: agent/go.sum
      - name: Verify source
        working-directory: agent
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          GOWORK=off go test ./...
          GOWORK=off go test -race ./...
          GOWORK=off go vet ./...
      - name: Build exact release artifacts
        working-directory: agent
        run: |
          set -euo pipefail
          mkdir -p release
          date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          commit_sha=$(git rev-parse HEAD)
          GOWORK=off go build -trimpath -ldflags "-X github.com/gxbrave/AntiNAT-Agent/internal/buildinfo.Version=$VERSION -X github.com/gxbrave/AntiNAT-Agent/internal/buildinfo.Commit=$commit_sha -X github.com/gxbrave/AntiNAT-Agent/internal/buildinfo.Date=$date_utc" -o release/antinat-agent-linux-amd64 ./cmd/antinat-agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOWORK=off go build -trimpath -ldflags "-X github.com/gxbrave/AntiNAT-Agent/internal/buildinfo.Version=$VERSION -X github.com/gxbrave/AntiNAT-Agent/internal/buildinfo.Commit=$commit_sha -X github.com/gxbrave/AntiNAT-Agent/internal/buildinfo.Date=$date_utc" -o release/antinat-agent-windows-amd64.exe ./cmd/antinat-agent
          install -m 755 scripts/install.sh release/install.sh
          install -m 644 scripts/install.ps1 release/install.ps1
          install -m 755 scripts/libinstall.sh release/libinstall.sh
          install -m 644 deploy/trust/release-ed25519.pub release/release-ed25519.pub
          jq -n --arg schema 'antinat.release-source/v1' --arg release "$VERSION" --arg module 'github.com/gxbrave/AntiNAT-Agent' --arg commit "$commit_sha" --arg tree "$(git rev-parse HEAD^{tree})" --arg go "$(go version)" --arg host "$(go env GOOS)/$(go env GOARCH)" --arg built "$date_utc" '{schema_version:$schema,release:$release,module:$module,commit_sha:$commit,tree_sha:$tree,go_version:$go,host:$host,built_at:$built,artifact_policy:"build-once-test-exact-manifest"}' > release/source.json
          sha256sum release/antinat-agent-linux-amd64 release/antinat-agent-windows-amd64.exe release/install.sh release/install.ps1 release/libinstall.sh release/release-ed25519.pub release/source.json > release/checksums.txt
          artifacts=$(awk '{print $2 "\t" $1}' release/checksums.txt | jq -Rn 'reduce inputs as $line ({}; ($line|split("\t")) as [$name,$digest] | .[$name]=$digest)')
          jq -n --arg schema '1' --arg release "$VERSION" --arg root 'release-key-2026' --arg algorithm 'ed25519' --argjson artifacts "$artifacts" '{schema_version:$schema,release:$release,artifacts:$artifacts,trust_root:$root,signature_algorithm:$algorithm}' > release/manifest.json
      - name: Sign manifest with protected release key
        working-directory: agent
        env:
          ANTINAT_RELEASE_SIGNING_KEY: ${{ secrets.ANTINAT_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANTINAT_RELEASE_SIGNING_KEY"
          key_file="$RUNNER_TEMP/antinat-agent-release.key"
          public_key_file="$RUNNER_TEMP/antinat-agent-release.pub"
          umask 077
          printf '%s' "$ANTINAT_RELEASE_SIGNING_KEY" > "$key_file"
          openssl pkey -in "$key_file" -pubout -out "$public_key_file"
          openssl pkey -pubin -in deploy/trust/release-ed25519.pub -outform DER -out "$RUNNER_TEMP/expected.der"
          openssl pkey -pubin -in "$public_key_file" -outform DER -out "$RUNNER_TEMP/actual.der"
          cmp -- "$RUNNER_TEMP/expected.der" "$RUNNER_TEMP/actual.der"
          openssl pkeyutl -sign -rawin -inkey "$key_file" -in release/manifest.json -out release/manifest.sig
          chmod 600 release/manifest.sig
          openssl pkeyutl -verify -pubin -inkey deploy/trust/release-ed25519.pub -rawin -in release/manifest.json -sigfile release/manifest.sig
      - name: Upload exact signed Agent bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: antinat-agent-${{ inputs.version }}
          path: agent/release
          if-no-files-found: error
          retention-days: 7
