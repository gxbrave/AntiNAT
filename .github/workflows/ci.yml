name: AntiNAT CI

on:
  pull_request:
  push:
    branches: [main, integration/v1-beta]

permissions:
  contents: read

concurrency:
  group: antinat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.5'

jobs:
  pr-fast:
    name: pr-fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Workflow policy
        run: go test ./scripts -run TestWorkflowPolicy -count=1
      - name: Validate evidence fixture
        run: go run ./scripts/verify-evidence.go ./test/evidence/fixtures/pass.json
      - name: Upload evidence fixture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-fast-evidence
          path: test/evidence/fixtures/pass.json
          retention-days: 7
          if-no-files-found: error

  pr-integration:
    name: pr-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: pr-fast
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - name: Race tests
        run: go test -race ./...
      - name: Build binaries
        run: |
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          test -n "$DATE"
          make build VERSION=ci COMMIT=${{ github.sha }} DATE="$DATE"
      - name: Verify cross-build
        run: GOOS=windows GOARCH=amd64 go build ./cmd/...
      - name: Upload bootstrap binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-integration-binaries
          path: bin/
          retention-days: 7
          if-no-files-found: error

  windows-pr:
    name: windows-pr
    runs-on: windows-2025
    timeout-minutes: 15
    needs: pr-fast
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - name: Test
        run: go test ./...
      - name: Build Windows binaries
        run: go build ./cmd/...
