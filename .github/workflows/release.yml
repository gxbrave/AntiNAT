name: AntiNAT v1.0-beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable beta version, for example v1.0.0-beta.1"
        required: true
        default: v1.0.0-beta.1
        type: string
      promote:
        description: "Run the protected promotion job after candidate verification"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: antinat-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.6'

jobs:
  candidate:
    name: build-and-verify-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - name: Install pinned release vulnerability scanner
        env:
          GOBIN: ${{ runner.temp }}/antinat-tools
        run: |
          mkdir -p "$GOBIN"
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Build once and run beta gates
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p artifacts/evidence
          GOWORK=off bash scripts/run-beta-gates.sh \
            --version "$RELEASE_VERSION" \
            --artifacts artifacts \
            --evidence artifacts/evidence
      - name: Verify candidate evidence
        run: GOWORK=off go run ./scripts/verify-release-evidence.go artifacts/evidence
      - name: Upload exact candidate bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: antinat-${{ inputs.version }}-candidate
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  promote:
    name: protected-promotion
    needs: candidate
    if: ${{ inputs.promote == true }}
    runs-on: ubuntu-24.04
    environment: antinat-release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - name: Download the exact candidate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: antinat-${{ inputs.version }}-candidate
          path: release-bundle
      - name: Verify candidate source identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(jq -r '.release' release-bundle/evidence/release.json)" = "$RELEASE_VERSION"
          test "$(jq -r '.source.commit_sha' release-bundle/evidence/release.json)" = "$GITHUB_SHA"
          test "$(jq -r '.source.commit_sha' release-bundle/release/source.json)" = "$GITHUB_SHA"
      - name: Sign and finalize metadata without rebuilding
        env:
          ANTINAT_RELEASE_SIGNING_KEY: ${{ secrets.ANTINAT_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$ANTINAT_RELEASE_SIGNING_KEY"
          key_file="$RUNNER_TEMP/antinat-release.key"
          umask 077
          printf '%s' "$ANTINAT_RELEASE_SIGNING_KEY" >"$key_file"
          openssl pkeyutl -sign -rawin -inkey "$key_file" \
            -in release-bundle/release/manifest.json \
            -out release-bundle/release/manifest.sig
          chmod 600 release-bundle/release/manifest.sig
          printf '%s\n' \
            'result=PASS' \
            'reason=protected promotion job verified the detached Ed25519 signature' \
            >release-bundle/evidence/signature.log
          jq --arg actor "$GITHUB_ACTOR" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.approval = {approved:true,approver:$actor,recorded_at:$now}
             | .gates = (.gates | map(if .id == "signature" then .result = "PASS" | .summary = "protected release signature verified in promotion job" else . end))
             | .known_limits = (.known_limits | map(if . == "No production release signing key or independent release approver was supplied to this candidate run." then "Manifest signature and release approval were completed by the protected promotion job." else . end))
             | .status = (if ([.gates[] | select(.required and .result != "PASS")] | length) == 0 then "PASS" else "SUPPORTED_WITH_LIMITS" end)
             | .signature_status = "PASS"' \
            release-bundle/evidence/release.json >release-bundle/evidence/release.json.tmp
          mv -- release-bundle/evidence/release.json.tmp release-bundle/evidence/release.json
      - name: Require promotion-grade evidence
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          GOWORK=off go run ./scripts/verify-release-evidence.go \
            --require-promotion release-bundle/evidence \
            >release-bundle/evidence/release-evidence.log
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ inputs.version }}' \
            --target "$GITHUB_SHA" \
            --title "AntiNAT ${{ inputs.version }}" \
            --generate-notes \
            release-bundle/release/*
