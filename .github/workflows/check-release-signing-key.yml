name: Check release signing environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: antinat-release
    steps:
      - name: Checkout trust root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate protected signing key
        env:
          ANTINAT_RELEASE_SIGNING_KEY: ${{ secrets.ANTINAT_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$ANTINAT_RELEASE_SIGNING_KEY" ]]; then
            echo 'ANTINAT_RELEASE_SIGNING_KEY is unavailable in the antinat-release environment' >&2
            exit 1
          fi
          printf 'release signing key supplied (%s characters)\n' "${#ANTINAT_RELEASE_SIGNING_KEY}"
          key_file="$RUNNER_TEMP/antinat-release.key"
          public_key_file="$RUNNER_TEMP/antinat-release.pub"
          umask 077
          printf '%s' "$ANTINAT_RELEASE_SIGNING_KEY" > "$key_file"
          openssl pkey -in "$key_file" -pubout -out "$public_key_file"
          openssl pkey -pubin -in deploy/trust/release-ed25519.pub -outform DER -out "$RUNNER_TEMP/expected.der"
          openssl pkey -pubin -in "$public_key_file" -outform DER -out "$RUNNER_TEMP/actual.der"
          cmp -- "$RUNNER_TEMP/expected.der" "$RUNNER_TEMP/actual.der"
